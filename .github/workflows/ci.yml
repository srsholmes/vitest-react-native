name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (Node ${{ matrix.node-version }}, RN ${{ matrix.react-native || 'latest' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        include:
          # Oldest supported React Native (End of Cycle) on the oldest Node it
          # supports, so the version-gated legacy mocks stay covered.
          - node-version: 20
            react-native: '0.85'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Use React Native ${{ matrix.react-native }}
        if: matrix.react-native
        run: pnpm -r up react-native@~${{ matrix.react-native }}.0 @react-native/babel-preset@~${{ matrix.react-native }}.0

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test:run

      - name: Test (Jest parity)
        run: pnpm test:jest
